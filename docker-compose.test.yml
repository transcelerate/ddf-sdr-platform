name: ddf-sdr-test

services:
  api:
    depends_on:
      - cdisc-rules-engine
      - mongodb
    build:
      context: ../ddf-sdr-api
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__ServerName=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongodb:27018/${MONGO_DATABASE}?authSource=admin
      - ConnectionStrings__DatabaseName=${MONGO_DATABASE}
      - StudyHistory__DateRange=30
      - ApiVersionUsdmVersionMapping=${API_VERSION_USDM_VERSION_MAPPING}
      - ASPNETCORE_ENVIRONMENT=Development
      - isGroupFilterEnabled=false
      - isAuthEnabled=false
    volumes:
      - cdisc-rules-engine-datasets:/shared/datasets
      - cdisc-rules-engine-output:/shared/output
    ports:
      - "8080:80"
    networks:
      - backend

  cdisc-rules-engine:
    image: cdisc-rules-engine:latest

  mongodb:
    volumes:
      - ./mongodb_dump:/mongodb_dump
      - ./02-mongodb-restore.sh:/docker-entrypoint-initdb.d/02-mongodb-restore.sh
